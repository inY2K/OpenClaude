<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hubFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.8">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Outer halo ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0.18"/>

  <!-- Provider nodes (8 points on the outer ring) -->
  <!-- Top -->
  <circle cx="256" cy="54"  r="11" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Top-right -->
  <circle cx="404" cy="112" r="8"  fill="url(#g1)" filter="url(#glow)" opacity="0.80"/>
  <!-- Right -->
  <circle cx="458" cy="256" r="11" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Bottom-right -->
  <circle cx="404" cy="400" r="8"  fill="url(#g1)" filter="url(#glow)" opacity="0.80"/>
  <!-- Bottom -->
  <circle cx="256" cy="458" r="11" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Bottom-left -->
  <circle cx="108" cy="400" r="8"  fill="url(#g1)" filter="url(#glow)" opacity="0.80"/>
  <!-- Left -->
  <circle cx="54"  cy="256" r="11" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Top-left -->
  <circle cx="108" cy="112" r="8"  fill="url(#g1)" filter="url(#glow)" opacity="0.80"/>

  <!-- Spokes from nodes to hub edge (r=158) -->
  <g stroke="url(#g1)" stroke-width="1.8" opacity="0.35" filter="url(#softglow)">
    <line x1="256" y1="54"  x2="256" y2="155"/>
    <line x1="404" y1="112" x2="333" y2="167"/>
    <line x1="458" y1="256" x2="357" y2="256"/>
    <line x1="404" y1="400" x2="333" y2="344"/>
    <line x1="256" y1="458" x2="256" y2="357"/>
    <line x1="108" y1="400" x2="179" y2="344"/>
    <line x1="54"  cy="256" x2="155" y2="256"/>
    <line x1="108" y1="112" x2="179" y2="167"/>
  </g>

  <!-- Hub circle background -->
  <circle cx="256" cy="256" r="113" fill="url(#hubFill)"/>
  <!-- Hub circle ring -->
  <circle cx="256" cy="256" r="113" fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#softglow)"/>
  <!-- Inner ring detail -->
  <circle cx="256" cy="256" r="96"  fill="none" stroke="url(#g1)" stroke-width="0.75" opacity="0.25"/>

  <!-- OC monogram -->
  <text
    x="256" y="302"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="112"
    font-weight="900"
    fill="url(#g1)"
    text-anchor="middle"
    filter="url(#textglow)"
    letter-spacing="-10"
  >OC</text>

  <!-- Corner accent dots (inside the rounded square) -->
  <circle cx="80"  cy="80"  r="3" fill="url(#g2)" opacity="0.4"/>
  <circle cx="432" cy="80"  r="3" fill="url(#g2)" opacity="0.4"/>
  <circle cx="432" cy="432" r="3" fill="url(#g2)" opacity="0.4"/>
  <circle cx="80"  cy="432" r="3" fill="url(#g2)" opacity="0.4"/>
</svg>
